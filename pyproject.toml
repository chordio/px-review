[project]
name = "px-review"
version = "0.1.0"
description = "Frontend product-experience review for pull requests. CLI first."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "openai>=2.0",
    "pydantic>=2.9",
    "pyjwt[crypto]>=2.10",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
px-review = "pxreview.cli:main"

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pxreview"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
