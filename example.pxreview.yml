# Copy to .pxreview.yml in an installed repository.
#
# include / exclude: `*` matches anything, directory separators included, and
# `**/` means zero or more directories. So `**/*.tsx` is every .tsx file at
# any depth, and `src/**/*.tsx` includes `src/Card.tsx` as well as
# `src/a/Card.tsx`. Check what a change to these selects with
# `px-review files --repo .` (no key needed). brief / context are pathlib
# globs against the working tree.
include:
  - "**/*.css"
  - "**/*.html"
  - "**/*.jsx"
  - "**/*.mdx"
  - "**/*.svelte"
  - "**/*.tsx"
  - "**/*.vue"
  - "**/components/**"
  - "**/pages/**"
  - "**/routes/**"
  - "**/screens/**"

exclude:
  - "**/*.snap"
  - "**/dist/**"
  - "**/generated/**"
  - "**/node_modules/**"
  - "**/vendor/**"

# Product briefs and repository-specific acceptance criteria get first claim on
# the context budget. PR title/body are always included.
brief:
  - "docs/product/**/*.md"

# Design-system and house-convention evidence.
context:
  - "AGENTS.md"
  - "README.md"
  - "package.json"
  - "**/components/ui/**/*"
  - "**/design-system/**/*"
  - "**/tokens.css"
  - "**/tokens.json"
  - "**/tokens.ts"
  - "**/tokens.tsx"

categories:
  - intent_fidelity
  - product_fit
  - visual_craft
  - convention_adherence
  - pathway_completeness
  - content_language
  - resilience
  - accessibility

model: gpt-5.6-terra
reasoning_effort: medium
min_confidence: 0.78
max_inline_comments: 12
# Severities that fail the check. Everything else is reported (red in the PR
# comment for blocking/high, yellow for medium/low) with a passing check.
# Add `high` here to fail on high findings too.
block_on:
  - blocking
review_drafts: false
review_forks: false
